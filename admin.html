<!DOCTYPE html>
<html lang="pt-BR" data-theme="azul">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel admin — adiantaMed</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#C8142F">
<link rel="icon" href="/favicon.ico" sizes="32x32">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/style.css?v=3">
<link rel="stylesheet" href="/portal.css?v=1">
</head>
<body class="portal-body" data-page="admin">
<a class="skip" href="#conteudo">Pular para o conteúdo</a>
<header class="portal-header">
<div class="wrap">
<a class="brand" href="/" aria-label="adiantaMed — voltar ao site"><img src="/logo.svg" alt="adiantaMed" width="204" height="26"></a>
<div class="portal-user" data-portal-user></div>
</div>
</header>
<main id="conteudo">

<div class="wrap">
<div class="portal-title"><div><h1>Painel admin</h1><p>Todas as operações e clientes da adiantaMed.</p></div></div>
<div class="alert" id="aviso" role="status" aria-live="polite" hidden></div>
<div class="stats" id="stats"></div>
<div class="page-tabs" role="tablist">
<button class="page-tab" type="button" role="tab" data-aba="ops" aria-selected="true">Operações</button>
<button class="page-tab" type="button" role="tab" data-aba="clientes" aria-selected="false">Clientes</button>
</div>
<section id="aba-ops">
<div class="toolbar">
<div class="chips">
<label class="sr" for="filtro-status">Filtrar por status</label><select id="filtro-status"></select>
<label class="sr" for="busca">Buscar</label><input id="busca" type="search" placeholder="Buscar nº, médico, hospital, CRM…">
</div>
<span class="small" id="cont-ops"></span>
</div>
<div id="tabela-ops"><p class="loading">Carregando…</p></div>
</section>
<section id="aba-clientes" hidden>
<div id="tabela-clientes"></div>
</section>
</div>

<dialog class="sheet" id="dlg-op" aria-labelledby="op-titulo">
<div class="sheet-head"><h2 id="op-titulo">Operação</h2><button class="icon-btn" type="button" data-fechar aria-label="Fechar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
<div class="sheet-body" id="op-corpo"></div>
</dialog>
</main>
<footer class="portal-footer">
<div class="wrap">
<span>© <span data-year>2026</span> adiantaMed</span>
<span><a href="/privacidade.html">Privacidade</a> · <a href="/termos.html">Termos</a> · <a href="/contato.html">Ajuda</a></span>
</div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script src="/config.js?v=1"></script>
<script src="/portal.js?v=1"></script>
<script>document.querySelectorAll('[data-year]').forEach(function(e){e.textContent=new Date().getFullYear()});</script>
</body>
</html>
